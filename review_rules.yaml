# ①曖昧語辞書(AIを使わずに照合する)
vague_words:
  - なるべく
  - できるだけ
  - 見やすく
  - 使いやすく
  - いい感じ
  - たくさん
  - 多い
  - 少ない
  - すぐに
  - 早く
  - 速く
  - 適当
  - 適切
  - 柔軟
  - 理想の
  - 学習させる

# 秘密情報らしき文字列(AIに送る前に警告する)
secret_patterns:
  - 'sk-[A-Za-z0-9_-]{8,}'
  - 'AIza[0-9A-Za-z_-]{10,}'
  - 'gh[pousr]_[A-Za-z0-9]{10,}'
  - '(?i)password\s*[:=]'
  - '(?i)api[_-]?key\s*[:=]'

# ②観点リスト(AIはこの観点に沿って指摘し、指摘には必ず番号を付ける)
viewpoints:
  - id: V-01
    text: 曖昧な表現(形容詞や「なるべく」など)が、数字や確かめられる条件になっているか
  - id: V-02
    text: 要求(利用者がしたいこと)と要件(システムが満たす条件)を混同していないか
  - id: V-03
    text: 機能(何をするか)と非機能(どの程度か)が分かれているか
  - id: V-04
    text: 目的に照らして、必要のない機能が入っていないか
  - id: V-05
    text: やらないこと(対象外)が書かれていて、範囲が決まっているか
  - id: V-06
    text: 達成できたかどうかを、あとで確かめられるか
  - id: V-07
    text: ほかの項目で決めたことと矛盾していないか
